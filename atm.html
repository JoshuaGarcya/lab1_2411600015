<!--
Programming Language: JavaScript (inside HTML)
Program Purpose: This program simulates a basic ATM Withdrawal System.
It allows the user to withdraw money from their account balance and
validates whether the withdrawal is possible based on available funds.
-->

<!DOCTYPE html>
<html>
<head>
    <title>ATM Withdrawal System</title>
</head>
<body>
    <h2>Welcome to the ATM Withdrawal System!</h2>
    <p>Account Balance: <span id="balance">500.0</span></p>

    <label for="withdraw">Enter withdrawal amount:</label>
    <input type="number" id="withdraw" />
    <button onclick="withdrawMoney()">Withdraw</button>

    <p id="message"></p>

    <script>
        // Step 1: Account Initialization
        let account_balance = 500.0;
        
        // Step 2: Withdrawal Function
        function withdrawMoney() {
            let withdrawal_amount = parseFloat(document.getElementById("withdraw").value);

            // Step 3: Validation Logic
            if (withdrawal_amount <= account_balance) {
                account_balance -= withdrawal_amount;
                document.getElementById("message").innerText = "Withdrawal successful!";
                document.getElementById("balance").innerText = account_balance.toFixed(2);
            } else {
                document.getElementById("message").innerText = "Insufficient funds!";
            }
        }
    </script>
</body>
</html>
